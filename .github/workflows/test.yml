name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: node --check school-email-monitor.js
      - name: Mocked Apps Script tests
        run: TZ=America/New_York node tests/offline-test.js
